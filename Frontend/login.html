<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Portfolio Bros</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="logo" href="index.html">Portfolio Bros</a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Create Account</a>
            </div>
        </nav>
    </header>

    <main class="auth-page">
        <section class="auth-card" aria-labelledby="login-title">
            <h1 id="login-title">Welcome back</h1>
            <p class="auth-description">
                Sign in to manage your portfolio.
            </p>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button class="button button-primary auth-submit" type="submit">
                    Sign In
                </button>

                <p id="login-message" role="status"></p>
            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>
        </section>
    </main>

    <script>
        document.getElementById("login-form").addEventListener("submit", function (event) {
            event.preventDefault();

            document.getElementById("login-message").textContent =
                "Sign-in is not connected yet. This page is a frontend preview.";
        });
    </script>
</body>
</html>
