<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Portfolio Bros</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="logo" href="index.html">Portfolio Bros</a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Sign In</a>
            </div>
        </nav>
    </header>

    <main class="auth-page">
        <section class="auth-card" aria-labelledby="register-title">
            <h1 id="register-title">Create your account</h1>
            <p class="auth-description">
                Start building your student portfolio.
            </p>

            <form id="register-form">
                <div class="form-group">
                    <label for="first-name">First name</label>
                    <input
                        type="text"
                        id="first-name"
                        autocomplete="given-name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="last-name">Last name</label>
                    <input
                        type="text"
                        id="last-name"
                        autocomplete="family-name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button class="button button-primary auth-submit" type="submit">
                    Create Account
                </button>

                <p id="register-message" role="status"></p>
            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>
        </section>
    </main>

    <script>
        const form = document.getElementById("register-form");
        const password = document.getElementById("password");
        const confirmation = document.getElementById("confirm-password");
        const message = document.getElementById("register-message");

        function checkPasswords() {
            confirmation.setCustomValidity(
                confirmation.value !== password.value
                    ? "Passwords must match."
                    : ""
            );
        }

        password.addEventListener("input", checkPasswords);
        confirmation.addEventListener("input", checkPasswords);

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            message.textContent =
                "Account creation is not connected yet. This page is a frontend preview.";
        });
    </script>
</body>
</html>
